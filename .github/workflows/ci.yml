name: CI Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking (All Files)
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit --pretty

      - name: Code Linting
        id: lint
        continue-on-error: true
        run: npm run lint || npx eslint . --ext .ts,.tsx,.js,.jsx

      - name: Unit Tests (Business Logic)
        id: test
        continue-on-error: true
        run: npm test -- --run || npx vitest run || echo "No test runner configured"

      - name: Build Project
        id: build
        continue-on-error: true
        run: npm run build

      - name: Evaluate CI Status
        run: |
          FAILED=0
          if [ "${{ steps.typecheck.outcome }}" == "failure" ]; then
            echo "TypeScript Type Checking failed! (Check logs above for full list of file errors)"
            FAILED=1
          fi
          if [ "${{ steps.lint.outcome }}" == "failure" ]; then
            echo "Code Linting failed!"
            FAILED=1
          fi
          if [ "${{ steps.test.outcome }}" == "failure" ]; then
            echo "Unit Tests failed! (Logic errors detected)"
            FAILED=1
          fi
          if [ "${{ steps.build.outcome }}" == "failure" ]; then
            echo "Build Project failed!"
            FAILED=1
          fi

          if [ $FAILED -ne 0 ]; then
            echo "CI Run completed with errors. All error logs have been captured."
            exit 1
          fi
          echo " All CI checks passed successfully!"
